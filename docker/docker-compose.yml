# Self-hosted stack: Postgres (feedback DB + n8n's own DB) + n8n.
# Put a TLS reverse proxy (Caddy/Traefik/nginx) in front - WhatsApp and Twilio
# webhooks require public HTTPS.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-n8n-db.sh:/docker-entrypoint-initdb.d/00-init-n8n-db.sh:ro
      - ../database/001_schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../database/002_functions.sql:/docker-entrypoint-initdb.d/20-functions.sql:ro
      - ../database/003_settings.sql:/docker-entrypoint-initdb.d/30-settings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    env_file: ../.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - ./data/n8n:/home/node/.n8n
