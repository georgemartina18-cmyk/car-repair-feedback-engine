name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rfe
          POSTGRES_PASSWORD: rfe
          POSTGRES_DB: rfe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfe" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflows match src/
        run: npm run check
      - name: Unit, workflow and database tests
        env:
          RFE_TEST_DATABASE_URL: postgres://rfe:rfe@localhost:5432/rfe_test
        run: npm test

  autocare-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocare-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: API tests
        run: npm test
      - name: Build frontend
        run: npm run build
